[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".idea",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "GameData",
    "docs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.14"
files = ["main.py", "src", "tools", "tests"]
exclude = "(^|/)(\\.git|\\.idea|\\.pytest_cache|\\.venv|__pycache__|GameData|docs)(/|$)"
namespace_packages = true
explicit_package_bases = true
implicit_optional = true
allow_untyped_globals = true
ignore_missing_imports = true
follow_imports = "skip"
show_error_codes = true
pretty = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "index",
    "misc",
    "operator",
    "return-value",
    "union-attr",
    "valid-type",
    "var-annotated",
]
